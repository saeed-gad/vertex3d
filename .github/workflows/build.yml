name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # يولّد مجلد android (الحزمة: com.invoicer.invoicer)
      - name: Create Android scaffold
        run: |
          flutter create --org com.invoicer --platforms=android --project-name invoicer /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          sed -i 's/flutter\.minSdkVersion/23/' android/app/build.gradle* || true
          # قفل التطبيق: بصمة/PIN + حظر لقطات الشاشة
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"\/>/' $M
          sed -i 's#@android:style/Theme.Light.NoTitleBar#@style/Theme.AppCompat.Light.NoActionBar#; s#@android:style/Theme.Black.NoTitleBar#@style/Theme.AppCompat.NoActionBar#' android/app/src/main/res/values*/styles.xml || true
          D=android/app/src/main/kotlin/com/invoicer/invoicer
          mkdir -p $D
          cat > $D/MainActivity.kt <<'KT'
          package com.invoicer.invoicer

          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterFragmentActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "invoicer/secure")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "setSecure") {
                              val on = call.arguments as? Boolean ?: false
                              runOnUiThread {
                                  if (on) window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                                  else window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                              }
                              result.success(null)
                          } else {
                              result.notImplemented()
                          }
                      }
              }
          }
          KT
          # تعطيل lintVital (بيكراش مع بعض إضافات Firebase)
          if [ -f android/build.gradle.kts ]; then
            printf '\nsubprojects {\n    tasks.configureEach {\n        if (name.startsWith("lintVital")) { enabled = false }\n    }\n}\n' >> android/build.gradle.kts
          else
            printf '\nsubprojects {\n    tasks.configureEach { t -> if (t.name.startsWith("lintVital")) { t.enabled = false } }\n}\n' >> android/build.gradle
          fi

      # يولّد إعدادات Firebase من السر GOOGLE_SERVICES_JSON
      - name: Generate Firebase config
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GSJ" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON is missing"; exit 1; fi
          printf '%s' "$GSJ" > google-services.json
          python3 - <<'PY'
          import json
          j = json.load(open('google-services.json'))
          pi = j['project_info']
          c = j['client'][0]
          api = c['api_key'][0]['current_key']
          app = c['client_info']['mobilesdk_app_id']
          web = ''
          cands = list(c.get('oauth_client', []))
          cands += c.get('services', {}).get('appinvite_service', {}).get('other_platform_oauth_client', [])
          for o in cands:
              if o.get('client_type') == 3:
                  web = o['client_id']
          opts = f"""import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {{
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: '{api}',
              appId: '{app}',
              messagingSenderId: '{pi['project_number']}',
              projectId: '{pi['project_id']}',
              storageBucket: '{pi.get('storage_bucket', '')}',
            );
          }}
          """
          open('lib/firebase_options.dart', 'w').write('\n'.join(l.lstrip() if False else l[10:] if l.startswith('          ') else l for l in opts.split('\n')))
          open('lib/google_config.dart', 'w').write(f"const String kWebClientId = '{web}';\n")
          print('web client id found:', bool(web))
          PY
          rm google-services.json

      # مفتاح توقيع ثابت (عشان SHA-1 ما يتغيّرش كل مرة)
      - name: Restore keystore
        id: ks
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Create keystore if missing
        if: steps.ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Save keystore
        if: steps.ks.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Show SHA-1 (add it in Firebase)
        run: |
          echo "### SHA-1 للإضافة في Firebase" >> $GITHUB_STEP_SUMMARY
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256" >> $GITHUB_STEP_SUMMARY

      - run: flutter pub get
      - name: Build APK
        env:
          UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=UPDATE_TOKEN=$UPDATE_TOKEN

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: invoicer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk invoicer.apk
          gh release create "$TAG" invoicer.apk --title "Invoicer $TAG" --notes "APK build #${{ github.run_number }}"
